# ============================================================================
#  rpi-power-monitor — CLIENT (web dashboard) configuration
#  Cross-platform (Windows or Linux).
#
#  The client is a stdlib Python web server. It connects to the Raspberry Pi
#  over TCP (raw binary stream), keeps a rolling history, and serves an
#  HTML/JS dashboard over HTTP + WebSocket. Open a browser at
#      http://<web.host>:<web.port>/       (default http://<this-machine>:8080/)
#
#  HOW TO CONFIGURE
#  ---------------------------------------------------------------------------
#  1. connection.host/port  -> where the Pi's `python -m server` runs (TCP 7000).
#  2. server_config         -> path to the server.yaml whose sensor.shunt table
#                              defines the channel ids & names (rails and their
#                              aggregates). The binary wire carries ids only, so
#                              the dashboard reads the names from there - keep
#                              it pointing at the same server.yaml the Pi runs.
#  3. If the dashboard runs on a DIFFERENT machine than the viewer, make sure
#     the Pi's server.yaml `server.allowed_clients` includes that machine's
#     subnet (or 0.0.0.0/0), otherwise the Pi rejects the TCP connection.
#  4. UI settings (metric, theme, energy unit, time window, hidden channels)
#     are browser-local: the defaults live in client/web/static/app.js and each
#     visitor's choices are kept in the pwm_settings cookie - nothing here.
# ============================================================================

# ---------------------------------------------------------------------------
# Channel catalog: the raw TCP stream carries numeric channel ids only, so the
# dashboard derives the channels (ids, names, rail/aggregate) from the server's
# own config. Point this at the server.yaml the Pi runs; a relative path is
# resolved next to this file. Override at runtime with
# `python -m client --server-config <path>`.
# ---------------------------------------------------------------------------
server_config: server.yaml

connection:
  host: 192.168.0.4         # TCP server = the Raspberry Pi. Alternatives:
                            #   raspberrypi.local   (mDNS, if enabled)
                            #   127.0.0.1           (dashboard on the Pi itself)
  port: 7000                # must match server.bind_port
  connect_timeout_s: 5
  read_timeout_s: 10        # reconnect if no frame arrives within this time
  reconnect: true           # automatically keep retrying when disconnected
  reconnect_delay_s: 2.0

# ---------------------------------------------------------------------------
# Web dashboard (HTTP + WebSocket) server
# ---------------------------------------------------------------------------
web:
  host: 0.0.0.0             # bind address
  port: 8080                # browser URL: http://<host>:8080/
  allowed_clients:         # empty/omitted => localhost only; list IPs/CIDRs to allow more
   - 127.0.0.0/8
   - 192.168.0.0/24

# ---------------------------------------------------------------------------
# Display / dashboard server. The catalog sent to the browser carries only what
# the server derives: the tab title, the channels + metric metadata (from
# server.yaml) and the push cadence / history depth.
#
# Purely visual defaults - preselected metric, theme, energy unit, and which
# options the Settings view offers - are browser-local: see the constants at
# the top of client/web/static/app.js. Each visitor's choices are stored in the
# pwm_settings cookie.
# ---------------------------------------------------------------------------
display:
  title: "Power Monitor"    # browser tab title
  update_ms: 133            # WebSocket sample-push cadence (ms)
  history_points: 3600      # rolling samples kept per channel (~10 min @ 7 Hz)
