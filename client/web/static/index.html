<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power Monitor</title>
  <link rel="stylesheet" href="/static/vendor/uPlot.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="layout">
    <button id="navToggle" class="nav-toggle" type="button"
            title="Toggle menu" aria-label="Toggle sidebar" aria-expanded="true">
      <svg class="ic ic-menu" viewBox="0 0 24 24" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
      <svg class="ic ic-arrow" viewBox="0 0 6 14" aria-hidden="true">
        <polyline points="1.25 1.5 4.5 7 1.25 12.5"/>
      </svg>
    </button>
    <nav id="sidebar" aria-label="Sections">
      <div class="nav-head">
        <span class="nav-head-ic" aria-hidden="true"></span>
        <span class="nav-title">Power Monitor</span>
      </div>
      <ul class="nav-list">
        <li>
          <button id="navDashboard" class="nav-item is-active" type="button">
            <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            <span class="nav-label">Dashboard</span>
          </button>
        </li>
      </ul>
      <span class="nav-group-title">Channels</span>
      <ul class="nav-list" id="navChannels"></ul>
      <ul class="nav-list nav-foot">
        <li>
          <button id="navSettings" class="nav-item" type="button">
            <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span class="nav-label">Settings</span>
          </button>
        </li>
      </ul>
    </nav>
    <main id="main">
      <section id="cards" aria-label="Channel readings"></section>
      <section id="channelView" aria-label="Channel detail" hidden>
        <header class="detail-head">
          <button id="btnBack" class="ghost" type="button" title="Back to the dashboard">← Dashboard</button>
          <h2 id="detailTitle"></h2>
          <span id="detailBadge" class="badge"></span>
        </header>
        <div id="channelFocus" aria-label="Focused channel"></div>
      </section>
     <section id="chartBox" aria-label="Dashboard graphs">
        <div id="dashGraphs"></div>
      </section>
      <section id="settingsView" aria-label="Settings" hidden></section>
    </main>
  </div>
  <script src="/static/vendor/uPlot.iife.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
